name: Compilar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: escaleras-apk
          path: app/build/outputs/apk/debug/app-debug.apk

Para descargar el APK

Ve a Actions. En la lista de la izquierda debe aparecer Compilar APK; ignora “pages build and deployment”.
Abre la ejecución de Compilar APK más reciente y espera el check verde.
Baja hasta Artifacts y descarga escaleras-apk. Dentro está app-debug.apk.

Si Compilar APK sale en rojo, pásame el texto del paso que falla y lo corrijo.

